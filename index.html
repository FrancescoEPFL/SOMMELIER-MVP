<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>René - AI Sommelier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .thinking-blink { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body class="bg-stone-50 text-stone-900 font-sans" onload="caricaMenu()">
    <div class="flex flex-col md:flex-row min-h-screen">
        <main class="flex-1 p-6 md:p-12">
            <header class="mb-10">
                <h1 class="text-4xl font-serif font-bold text-red-900">L'Incanto Divino</h1>
                <p class="text-stone-500 italic">Seleziona i piatti per ricevere il consiglio di René</p>
            </header>
            <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                </div>
        </main>

        <aside class="md:w-1/3 bg-white border-l border-stone-200 p-8 sticky top-0 h-screen flex flex-col items-center justify-center text-center shadow-xl">
            <div id="avatar-container" class="relative mb-6">
                <div class="w-48 h-48 rounded-full border-4 border-red-800 overflow-hidden shadow-2xl mx-auto bg-stone-100">
                    <img id="avatar-img" src="assets/idle.png" alt="René" class="w-full h-full object-cover">
                </div>
                <div id="status-badge" class="absolute bottom-2 right-2 bg-green-500 w-5 h-5 rounded-full border-2 border-white"></div>
            </div>
            <div class="bg-stone-100 p-6 rounded-2xl relative shadow-inner w-full">
                <div class="absolute -top-3 left-1/2 -translate-x-1/2 w-6 h-6 bg-stone-100 rotate-45"></div>
                <p id="ai-bubble" class="text-lg leading-relaxed italic">"Benvenuto! Selezioni un piatto e troverò l'abbinamento perfetto."</p>
            </div>
            <div id="selected-list" class="mt-6 text-sm text-stone-400">Nessun piatto selezionato</div>
        </aside>
    </div>

    <script src="script.js"></script>
</body>
</html>
